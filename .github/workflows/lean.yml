name: Lean mathematical specifications

on:
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "inst/stan/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "formal/**"
      - "inst/stan/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Elan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/arfun-elan"
          mkdir -p "$install_dir"
          gh release download v4.2.4 --repo leanprover/elan \
            --pattern elan-x86_64-unknown-linux-gnu.tar.gz --dir "$install_dir"
          archive="$install_dir/elan-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' \
            '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63' \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir"
          "$install_dir/elan-init" -y --no-modify-path --default-toolchain none
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build, replay, and audit proofs
        run: python3 formal/check.py --bootstrap
