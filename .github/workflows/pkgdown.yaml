on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: pkgdown

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Disable broken Google Chrome apt source
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google.list
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Do not resolve all Suggests: cmdstanr and oneearthr are optional and
      # the vignette has a fallback when oneearthr is unavailable.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::pkgdown, any::ape, any::Rcpp, any::RcppParallel, github::alrobles/ucminfcpp
          needs: ""

      - name: Install arfun
        run: R CMD INSTALL --no-multiarch .

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: pkgdown
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
